<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Event Tester</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            background-color: #f0f2f5;
            box-sizing: border-box;
        }
        .header-nav {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }
        .nav-button {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            text-decoration: none;
            color: #495057;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .nav-button:hover {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }
        main {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        #drop-target {
            flex-shrink: 0;
            height: 300px;
            border: 2px dashed #adb5bd;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            color: #6c757d;
            background-color: #fff;
            transition: all 0.2s ease-in-out;
            text-align: center;
        }
        #drop-target.hover {
            border-color: #007bff;
            background-color: #e9f5ff;
            color: #007bff;
        }
        .log-container-wrapper {
            display: flex;
            flex-direction: column;
            min-height: 200px;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            overflow: hidden;
        }
        .log-header {
            padding: 0.75rem 1.25rem;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        #clear-log {
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 6px;
            border: 1px solid #ced4da;
            background-color: #fff;
            cursor: pointer;
        }
        #clear-log:hover {
            background-color: #f1f3f5;
        }
        #log-container {
            flex-grow: 1;
            height: 300px;
            padding: 1rem;
            overflow-y: auto;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.875rem;
            color: #212529;
        }
        .log-entry {
            margin-bottom: 0.5rem;
            white-space: pre-wrap;
            border-bottom: 1px solid #e9ecef;
            padding-bottom: 0.5rem;
        }
        .status-panel {
            padding: 0.75rem 1.25rem;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            font-weight: 500;
            color: #495057;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #adb5bd; /* Gray for Idle */
            margin-right: 10px;
            transition: background-color 0.2s;
        }
        .status-indicator.active {
            background-color: #28a745; /* Green for Dragging */
        }
    </style>
</head>
<body>
    <div class="header-nav" style="gap: 0.5rem;">
        <a href="https://moukaeritai.work" class="nav-button" target="moukaeritai.work">moukaeritai.work</a>
        <a href="/" class="nav-button">← ホームへ戻る</a>
    </div>
    <main>
        <div style="text-align: center; margin-bottom: 1rem; color: #495057;">
            <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Drop Event Tester</h1>
            <p style="margin: 0; font-size: 0.95rem;">ブラウザが受け取るドラッグ＆ドロップイベント（ファイルやテキストのメタデータ）をリアルタイムで解析・表示します。</p>
        </div>
        <div id="drop-target">
            ここにファイルをドラッグ＆ドロップしてください
        </div>

        <div id="drag-status" class="status-panel">
            <span id="status-dot" class="status-indicator"></span>
            <span id="status-text">待機中 (Idle)</span>
            <span id="drag-info" style="margin-left: auto; font-family: monospace; font-size: 0.9em; color: #6c757d;"></span>
        </div>

        <div class="log-container-wrapper">
            <div class="log-header">
                <span>イベントログ</span>
                <button id="clear-log">ログを消去</button>
            </div>
            <div id="log-container"></div>
        </div>
    </main>

    <script>
        const dropTarget = document.getElementById('drop-target');
        const logContainer = document.getElementById('log-container');
        const clearLogBtn = document.getElementById('clear-log');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');
        const dragInfo = document.getElementById('drag-info');

        const log = (message, ...details) => {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = message;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight; // 自動スクロール
            
            // 開発者コンソールには詳細オブジェクトも出力
            if (details.length > 0) {
                console.log(message, ...details);
            } else {
                console.log(message);
            }
        };

        const updateStatus = (text, isActive, info = '') => {
            statusText.textContent = text;
            if (isActive) {
                statusDot.classList.add('active');
            } else {
                statusDot.classList.remove('active');
            }
            dragInfo.textContent = info;
        };

        clearLogBtn.addEventListener('click', () => {
            logContainer.innerHTML = '';
            console.clear();
        });

        log('ページの準備ができました。ドロップを待っています...');

        dropTarget.addEventListener('dragenter', (event) => {
            event.preventDefault();
            dropTarget.classList.add('hover');
            log('dragenter: ドロップターゲットに入りました');
            updateStatus('ドラッグ中 (Dragging)', true);
        });

        dropTarget.addEventListener('dragover', (event) => {
            event.preventDefault(); // ドロップを許可
            // log('dragover: ...') は削除してログ出力を抑制
            
            // インジケーターの情報を更新
            const info = `types: [${event.dataTransfer.types.join(', ')}] | effectAllowed: ${event.dataTransfer.effectAllowed} | x: ${event.clientX}, y: ${event.clientY}`;
            updateStatus('ドラッグ中 (Dragging)', true, info);
        });

        dropTarget.addEventListener('dragleave', (event) => {
            dropTarget.classList.remove('hover');
            log('dragleave: ドロップターゲットから離れました');
            updateStatus('待機中 (Idle)', false);
        });

        dropTarget.addEventListener('drop', (event) => {
            event.preventDefault(); // デフォルトの動作（ファイルを開くなど）をキャンセル
            dropTarget.classList.remove('hover');
            updateStatus('ドロップ処理完了 (Dropped)', false);
            log('--- drop: ドロップイベントが発生しました！ ---');

            const dataTransfer = event.dataTransfer;
            log(`Drop Effect: ${dataTransfer.dropEffect}`);
            log(`Effect Allowed: ${dataTransfer.effectAllowed}`);
            const types = dataTransfer.types;
            log(`利用可能なデータ型 (types): [${types.join(', ')}]`);

            if (dataTransfer.items && dataTransfer.items.length > 0) {
                log(`DataTransfer.items (${dataTransfer.items.length}個):`);
                for (let i = 0; i < dataTransfer.items.length; i++) {
                    const item = dataTransfer.items[i];
                    log(`  Item ${i}: kind=${item.kind}, type=${item.type}`);

                    if (item.kind === 'file') {
                        const file = item.getAsFile();
                        if (file) {
                            log(`    -> File: name=${file.name}, size=${file.size} bytes, type=${file.type}`);
                        }
                    } else if (item.kind === 'string') {
                        item.getAsString((s) => {
                            log(`    -> String [${item.type}]: ${s.substring(0, 200)}${s.length > 200 ? '...' : ''}`);
                        });
                    }
                }
            } else if (dataTransfer.files && dataTransfer.files.length > 0) {
                 log(`DataTransfer.files (${dataTransfer.files.length}個) [旧API]:`);
                for (let i = 0; i < dataTransfer.files.length; i++) {
                    const file = dataTransfer.files[i];
                    log(`  File ${i}: name=${file.name}, size=${file.size} bytes, type=${file.type}`);
                }
            } else {
                 log('DataTransfer.items も DataTransfer.files も空です。');
            }

            // getData() も試す
            types.forEach(type => {
                const data = dataTransfer.getData(type);
                if (data) {
                    log(`getData('${type}'): ${data.substring(0, 200)}${data.length > 200 ? '...' : ''}`);
                }
            });
             log('--- イベント処理終了 ---');
        });
    </script>
</body>
</html>
