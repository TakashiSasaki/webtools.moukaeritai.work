<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container {
            height: calc(100vh - 180px);
        }

        .message-bubble {
            max-width: 85%;
            word-wrap: break-word;
        }

        .sidebar-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-item.active {
            background-color: #fff7ed;
            border-left: 4px solid #d97706;
        }

        .last-output-preview {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .loading-dot {
            animation: pulse-dot 1.5s infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-white border-b px-4 py-3 flex items-center justify-between sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-3 overflow-hidden">
            <div class="bg-gradient-to-tr from-amber-500 to-rose-600 p-2 rounded-xl flex-shrink-0 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
            </div>
            <div class="flex flex-col">
                <h1 class="text-sm font-bold tracking-tight leading-none mb-1">AI Playground v6</h1>
                <select id="model-select"
                    class="bg-transparent text-[11px] text-slate-500 font-semibold focus:outline-none border-none p-0 cursor-pointer hover:text-amber-600 transition-colors">
                    <optgroup label="Specialized Models">
                        <option value="gemini-robotics-er-1.5">Gemini Robotics-ER 1.5 (Thinking)</option>
                        <option value="gemini-2.0-flash-thinking-preview-01-21">Gemini 2.0 Flash Thinking</option>
                    </optgroup>
                    <optgroup label="Gemini Series">
                        <option value="gemini-2.5-flash-preview-09-2025">Gemini 2.5 Flash</option>
                        <option value="gemini-2.0-flash-lite-preview-09-2025">Gemini 2.0 Flash-Lite</option>
                    </optgroup>
                    <optgroup label="Gemma 3 (Neural/Linear)">
                        <option value="gemma-3-27b-n-it">Gemma 3N 27B</option>
                        <option value="gemma-3-12b-n-it">Gemma 3N 12B</option>
                        <option value="gemma-3-4b-n-it">Gemma 3N 4B</option>
                    </optgroup>
                    <optgroup label="Gemma 3 (Standard/Edge)">
                        <option value="gemma-3-27b-it">Gemma 3 27B</option>
                        <option value="gemma-3-12b-it">Gemma 3 12B</option>
                        <option value="gemma-3-4b-it">Gemma 3 4B</option>
                        <option value="gemma-3-1b-it">Gemma 3 1B</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <a href="readme.html"
                class="p-2 hover:bg-slate-100 rounded-full transition-all text-slate-500 active:scale-90"
                title="About this tool">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </a>
            <div id="status-badge"
                class="hidden sm:block text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200">
                Ready
            </div>
            <button id="settings-btn"
                class="p-2 hover:bg-slate-100 rounded-full transition-all text-slate-500 active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </header>

    <div class="flex flex-grow overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="hidden lg:flex w-72 flex-col bg-white border-r border-slate-200 overflow-y-auto shrink-0 shadow-sm">
            <div class="px-4 py-3 border-b bg-slate-50/50 flex justify-between items-center">
                <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Model States</h2>
                <div class="flex items-center gap-1">
                    <button id="list-models-btn" title="Fetch available models from API"
                        class="text-slate-400 hover:text-amber-600 transition-colors p-1 rounded-md hover:bg-amber-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                    </button>
                    <button id="copy-models-btn" title="Copy all Model IDs"
                        class="text-slate-400 hover:text-amber-600 transition-colors p-1 rounded-md hover:bg-amber-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="model-tabs" class="flex p-2 gap-1 border-b bg-white">
                <button id="tab-gemini" onclick="setSidebarTab('gemini')"
                    class="flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all">Gemini</button>
                <button id="tab-gemma" onclick="setSidebarTab('gemma')"
                    class="flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all">Gemma</button>
                <button id="tab-others" onclick="setSidebarTab('others')"
                    class="flex-1 py-1.5 text-[10px] font-bold rounded-lg transition-all">Others</button>
            </div>
            <div id="model-list" class="flex-grow p-2 space-y-1">
                <!-- Dynamically populated -->
            </div>
        </aside>

        <div class="flex flex-col flex-grow relative min-w-0">
            <!-- Chat Area -->
            <main id="chat-window" class="chat-container flex-grow overflow-y-auto p-4 space-y-6">
                <div id="setup-notice" class="hidden bg-amber-50 border border-amber-100 rounded-2xl p-6 text-center">
                    <p class="text-amber-900 font-bold mb-2 text-sm">System Integration</p>
                    <p class="text-amber-700 text-[11px] mb-4 leading-relaxed">
                        Gemini Robotics-ER 1.5 などの特殊モデルを含むマルチモデル環境です。<br>APIキーを設定して開始してください。
                    </p>
                </div>
            </main>

            <!-- Input Area -->
            <footer class="bg-white border-t p-4 pb-8 md:pb-4 shadow-inner">
                <div class="max-w-4xl mx-auto flex gap-3 items-end">
                    <div class="relative flex-grow">
                        <textarea id="user-input" rows="1" placeholder="物理エージェントへの指示を入力..."
                            class="w-full bg-slate-100 border-none rounded-2xl px-4 py-3.5 pr-12 resize-none focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all text-sm shadow-sm"
                            oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 200) + 'px'"></textarea>

                        <div id="loading-indicator" class="hidden absolute right-3 bottom-4 flex gap-1">
                            <div class="w-1.5 h-1.5 bg-amber-500 rounded-full loading-dot"></div>
                            <div class="w-1.5 h-1.5 bg-amber-500 rounded-full loading-dot"
                                style="animation-delay: 0.2s"></div>
                            <div class="w-1.5 h-1.5 bg-amber-500 rounded-full loading-dot"
                                style="animation-delay: 0.4s"></div>
                        </div>
                    </div>
                    <button id="send-btn"
                        class="bg-amber-600 hover:bg-amber-700 text-white p-3.5 rounded-2xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:grayscale">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>
            </footer>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-bold text-slate-800">API Settings</h3>
                <button id="close-settings"
                    class="text-slate-400 hover:text-slate-600 text-3xl leading-none">&times;</button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Google API
                        Key</label>
                    <input type="password" id="api-key-input"
                        class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all"
                        placeholder="AIzaSy...">
                    <p class="text-[10px] text-slate-400 mt-3 leading-relaxed italic">
                        ※ APIキーはブラウザにのみ保存されます。
                    </p>
                </div>

                <button id="save-key-btn"
                    class="w-full bg-amber-600 hover:bg-amber-700 text-white py-4 rounded-2xl font-bold transition-all shadow-xl active:translate-y-0.5">
                    Save Key
                </button>

                <div class="pt-4 flex flex-col items-center">
                    <button id="clear-key-btn"
                        class="text-rose-500 text-[10px] font-black uppercase tracking-[0.2em] hover:text-rose-600 transition-colors">
                        Clear Data
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Models List Modal -->
    <div id="models-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
        <div
            class="bg-white rounded-[2rem] p-8 max-w-2xl w-full shadow-2xl transform transition-all flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-slate-800">Available Models</h3>
                <button id="close-models"
                    class="text-slate-400 hover:text-slate-600 text-3xl leading-none">&times;</button>
            </div>

            <div id="models-loading" class="hidden py-12 text-center text-slate-400">
                <div
                    class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent mb-2">
                </div>
                <p class="text-xs font-bold uppercase tracking-widest">Fetching models...</p>
            </div>

            <div id="models-content" class="overflow-y-auto flex-grow pr-2">
                <p class="text-[10px] text-slate-400 mb-4 italic">※ APIから取得可能なモデル一覧です。ここに含まれなくても利用可能なIDが存在する場合があります。</p>
                <div id="models-list-inner" class="space-y-3">
                    <!-- Fetched models will appear here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-28 left-1/2 -translate-x-1/2 px-5 py-2.5 bg-slate-800 text-white text-[11px] font-bold rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-[60] flex items-center gap-2">
        <span id="toast-icon">🤖</span>
        <span id="toast-text">Success</span>
    </div>

    <script>
        let config = {
            apiKey: localStorage.getItem('playground_v6_api_key') || "",
            model: localStorage.getItem('playground_v6_model') || "gemini-2.5-flash-preview-09-2025"
        };

        let currentSidebarTab = 'gemini';
        const modelStats = JSON.parse(localStorage.getItem('playground_v6_stats') || "{}");

        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const modelListContainer = document.getElementById('model-list');
        const loadingIndicator = document.getElementById('loading-indicator');
        const statusBadge = document.getElementById('status-badge');
        const setupNotice = document.getElementById('setup-notice');
        const settingsModal = document.getElementById('settings-modal');
        const apiKeyInput = document.getElementById('api-key-input');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toast-text');

        // --- UI Logic ---

        function setSidebarTab(tab) {
            currentSidebarTab = tab;
            initSidebar();
            refreshSidebar();
        }

        function refreshSidebarTabsUI() {
            const tabs = ['gemini', 'gemma', 'others'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (!btn) return;
                if (t === currentSidebarTab) {
                    btn.className = "flex-1 py-1.5 text-[10px] font-bold rounded-lg bg-amber-600 text-white shadow-sm";
                } else {
                    btn.className = "flex-1 py-1.5 text-[10px] font-bold rounded-lg bg-slate-100 text-slate-500 hover:bg-slate-200";
                }
            });
        }

        function initSidebar() {
            refreshSidebarTabsUI();
            modelListContainer.innerHTML = '';

            const allOptions = Array.from(modelSelect.querySelectorAll('option'));
            const filtered = allOptions.filter(opt => {
                const val = opt.value.toLowerCase();
                const text = opt.text.toLowerCase();
                if (currentSidebarTab === 'gemini') return val.includes('gemini');
                if (currentSidebarTab === 'gemma') return val.includes('gemma');
                if (currentSidebarTab === 'others') return !val.includes('gemini') && !val.includes('gemma');
                return false;
            });

            if (filtered.length === 0) {
                modelListContainer.innerHTML = '<div class="text-[10px] text-slate-400 text-center py-12">No models found</div>';
                return;
            }

            filtered.forEach(opt => {
                const item = document.createElement('div');
                item.id = `sidebar-item-${opt.value}`;
                item.className = `sidebar-item p-3 rounded-xl cursor-pointer hover:bg-slate-100 border border-transparent mb-1 ${config.model === opt.value ? 'active' : ''}`;
                item.onclick = () => {
                    config.model = opt.value;
                    modelSelect.value = opt.value;
                    localStorage.setItem('playground_v6_model', opt.value);
                    refreshSidebar();
                    showToast(`Model: ${opt.value}`, "⚙️");
                };

                const lastResponse = modelStats[opt.value];
                const statusColor = lastResponse ? (lastResponse.error ? 'bg-rose-500' : 'bg-emerald-500') : 'bg-slate-300';
                const previewText = lastResponse ? lastResponse.text : "No interactions yet.";

                item.innerHTML = `
                    <div class="flex items-center gap-2 mb-1">
                        <div class="w-1.5 h-1.5 rounded-full ${statusColor}"></div>
                        <span class="text-[11px] font-bold text-slate-700 truncate">${opt.text}</span>
                    </div>
                    <p class="text-[10px] text-slate-400 last-output-preview italic leading-tight">
                        ${previewText}
                    </p>
                `;
                modelListContainer.appendChild(item);
            });
        }

        function refreshSidebar() {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`sidebar-item-${config.model}`);
            if (activeItem) {
                activeItem.classList.add('active');
            }

            // Update previews
            for (const [mId, stat] of Object.entries(modelStats)) {
                const item = document.getElementById(`sidebar-item-${mId}`);
                if (item) {
                    const dot = item.querySelector('.w-1.5');
                    const preview = item.querySelector('.last-output-preview');
                    dot.className = `w-1.5 h-1.5 rounded-full ${stat.error ? 'bg-rose-500' : 'bg-emerald-500'}`;
                    preview.innerText = stat.text;
                    if (stat.error) {
                        preview.classList.add('text-rose-400');
                    } else {
                        preview.classList.remove('text-rose-400');
                    }
                }
            }
        }

        function showToast(msg, icon = "🤖") {
            toastText.innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.replace('opacity-0', 'opacity-100');
            toast.style.transform = 'translate(-50%, -10px)';
            setTimeout(() => {
                toast.classList.replace('opacity-100', 'opacity-0');
                toast.style.transform = 'translate(-50%, 0px)';
            }, 3000);
        }

        function refreshUIState() {
            if (!config.apiKey) {
                setupNotice.classList.remove('hidden');
                sendBtn.disabled = true;
            } else {
                setupNotice.classList.add('hidden');
                sendBtn.disabled = false;
            }
            apiKeyInput.value = config.apiKey;
            modelSelect.value = config.model;
            refreshSidebar();
        }

        function appendMessage(role, text, modelId) {
            const container = document.createElement('div');
            container.className = `flex flex-col ${role === 'user' ? 'items-end' : 'items-start'} space-y-1`;

            if (role === 'ai' && modelId) {
                const attribution = document.createElement('div');
                attribution.className = "text-[9px] font-black uppercase tracking-tighter text-slate-400 ml-2";
                attribution.innerText = modelId;
                container.appendChild(attribution);
            }

            const bubble = document.createElement('div');
            bubble.className = `message-bubble p-4 shadow-sm text-sm leading-relaxed ${role === 'user'
                ? 'bg-amber-600 text-white rounded-2xl rounded-tr-none'
                : 'bg-white border border-slate-200 rounded-2xl rounded-tl-none text-slate-700'
                }`;
            bubble.innerText = text;

            container.appendChild(bubble);
            chatWindow.appendChild(container);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        }

        // --- API & Engine ---

        async function fetchAIResponse(prompt, retryCount = 0) {
            const maxRetries = 5;
            const backoffTimes = [1000, 2000, 4000, 8000, 16000];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) {
                    const errorJson = await response.json().catch(() => ({}));
                    const msg = errorJson.error?.message || `Status: ${response.status}`;

                    if ((response.status >= 500 || response.status === 429) && retryCount < maxRetries) {
                        await new Promise(r => setTimeout(r, backoffTimes[retryCount]));
                        return fetchAIResponse(prompt, retryCount + 1);
                    }
                    throw new Error(msg);
                }

                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
            } catch (err) {
                if (retryCount < maxRetries && (err.name === 'TypeError' || err.message.includes('fetch'))) {
                    await new Promise(r => setTimeout(r, backoffTimes[retryCount]));
                    return fetchAIResponse(prompt, retryCount + 1);
                }
                throw err;
            }
        }

        async function handleSubmission() {
            const text = userInput.value.trim();
            if (!text || sendBtn.disabled || !config.apiKey) return;

            const usedModel = config.model;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;
            loadingIndicator.classList.remove('hidden');
            statusBadge.innerText = "Embodying...";
            statusBadge.className = "hidden sm:block text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full bg-amber-100 text-amber-700 border border-amber-200";

            try {
                const responseText = await fetchAIResponse(text);
                appendMessage('ai', responseText, usedModel);
                modelStats[usedModel] = { text: responseText, error: false };
                localStorage.setItem('playground_v6_stats', JSON.stringify(modelStats));
                refreshSidebar();
            } catch (err) {
                const errMsg = `❌ Integration Error: ${err.message}`;
                appendMessage('ai', errMsg, usedModel);
                modelStats[usedModel] = { text: errMsg, error: true };
                localStorage.setItem('playground_v6_stats', JSON.stringify(modelStats));
                refreshSidebar();
            } finally {
                sendBtn.disabled = false;
                loadingIndicator.classList.add('hidden');
                statusBadge.innerText = "Ready";
                statusBadge.className = "hidden sm:block text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200";
            }
        }

        // --- Listeners ---

        modelSelect.onchange = (e) => {
            config.model = e.target.value;
            localStorage.setItem('playground_v6_model', config.model);
            showToast(`Model: ${config.model}`, "⚙️");
        };

        document.getElementById('settings-btn').onclick = () => settingsModal.classList.remove('hidden');
        document.getElementById('close-settings').onclick = () => settingsModal.classList.add('hidden');

        document.getElementById('save-key-btn').onclick = () => {
            const val = apiKeyInput.value.trim();
            if (val) {
                config.apiKey = val;
                localStorage.setItem('playground_v6_api_key', val);
                showToast("Key Integrated", "🔑");
                settingsModal.classList.add('hidden');
                refreshUIState();
            }
        };

        document.getElementById('clear-key-btn').onclick = () => {
            if (confirm("Clear integration data?")) {
                config.apiKey = "";
                localStorage.removeItem('playground_v6_api_key');
                apiKeyInput.value = "";
                showToast("Cleared", "🗑️");
                refreshUIState();
            }
        };

        document.getElementById('list-models-btn').onclick = async () => {
            if (!config.apiKey) {
                showToast("Set API Key first", "⚠️");
                return;
            }

            const modal = document.getElementById('models-modal');
            const loading = document.getElementById('models-loading');
            const content = document.getElementById('models-content');
            const listInner = document.getElementById('models-list-inner');

            modal.classList.remove('hidden');
            loading.classList.remove('hidden');
            content.classList.add('hidden');
            listInner.innerHTML = '';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${config.apiKey}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (data.models) {
                    data.models.forEach(model => {
                        const isInteractive = model.supportedGenerationMethods.includes('generateContent');
                        const card = document.createElement('div');
                        card.className = `bg-slate-50 border ${isInteractive ? 'border-amber-200 bg-amber-50/30' : 'border-slate-100'} rounded-xl p-4 flex flex-col gap-1 relative overflow-hidden`;

                        card.innerHTML = `
                            ${isInteractive ? '<div class="absolute -right-6 top-2 rotate-45 bg-amber-500 text-white text-[8px] font-black px-8 py-0.5 shadow-sm">CHAT</div>' : ''}
                            <div class="flex justify-between items-start">
                                <span class="text-xs font-black text-amber-600 font-mono">${model.name.replace('models/', '')}</span>
                                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter bg-white px-1.5 py-0.5 rounded border border-slate-100">${model.version || 'v?'}</span>
                            </div>
                            <h4 class="text-sm font-bold text-slate-800 leading-tight">${model.displayName}</h4>
                            <p class="text-[11px] text-slate-500 leading-relaxed mt-1">${model.description}</p>
                            <div class="flex flex-wrap gap-2 mt-2">
                                ${model.supportedGenerationMethods.map(m => {
                            const isTarget = m === 'generateContent';
                            return `<span class="text-[9px] font-bold ${isTarget ? 'bg-amber-600 text-white' : 'bg-slate-200 text-slate-600'} px-1.5 py-0.5 rounded">${m}</span>`;
                        }).join('')}
                            </div>
                        `;
                        listInner.appendChild(card);
                    });
                }
                loading.classList.add('hidden');
                content.classList.remove('hidden');
            } catch (err) {
                loading.classList.add('hidden');
                showToast(`Fetch Error: ${err.message}`, "❌");
                modal.classList.add('hidden');
            }
        };

        document.getElementById('close-models').onclick = () => {
            document.getElementById('models-modal').classList.add('hidden');
        };

        document.getElementById('copy-models-btn').onclick = () => {
            const ids = Array.from(modelSelect.querySelectorAll('option')).map(opt => opt.value).join('\n');
            navigator.clipboard.writeText(ids).then(() => {
                showToast("IDs Copied to Clipboard", "📋");
            });
        };

        sendBtn.onclick = handleSubmission;
        userInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSubmission();
            }
        };

        window.onload = () => {
            initSidebar();
            refreshUIState();
        };
    </script>
</body>

</html>
