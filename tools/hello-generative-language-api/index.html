<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-white border-b px-4 py-3 flex items-center justify-between sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-3 overflow-hidden">
            <div class="bg-gradient-to-tr from-amber-500 to-rose-600 p-2 rounded-xl flex-shrink-0 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                </svg>
            </div>
            <div class="flex flex-col">
                <h1 class="text-sm font-bold tracking-tight leading-none mb-1">AI Playground v6</h1>
                <select id="model-select"
                    class="bg-transparent text-[11px] text-slate-500 font-semibold focus:outline-none border-none p-0 cursor-pointer hover:text-amber-600 transition-colors">
                    <optgroup label="Experimental & Specialized">
                        <option value="gemini-robotics-er-1.5">Gemini Robotics-ER 1.5</option>
                        <option value="gemini-robotics-er-1.5-preview">Gemini Robotics-ER 1.5 (Preview)</option>
                        <option value="gemini-2.0-flash-thinking-preview-01-21">Gemini 2.0 Flash Thinking</option>
                        <option value="gemini-2.0-flash-exp-image-generation">Gemini 2.0 Flash Image Gen</option>
                        <option value="gemini-2.5-flash-preview-tts">Gemini 2.5 Flash TTS</option>
                        <option value="gemini-2.5-pro-preview-tts">Gemini 2.5 Pro TTS</option>
                        <option value="deep-research-pro-preview-12-2025">Deep Research Pro</option>
                        <option value="gemini-3-pro-preview">Gemini 3 Pro (Preview)</option>
                        <option value="gemini-3-flash-preview">Gemini 3 Flash (Preview)</option>
                        <option value="gemini-3-pro-image-preview">Gemini 3 Pro Image (Preview)</option>
                        <option value="nano-banana-pro-preview">Nano Banana Pro (Preview)</option>
                    </optgroup>
                    <optgroup label="Gemini Series">
                        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                        <option value="gemini-2.5-flash-preview-09-2025">Gemini 2.5 Flash (09-2025)</option>
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        <option value="gemini-2.0-flash-001">Gemini 2.0 Flash (001)</option>
                        <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash-Lite</option>
                        <option value="gemini-2.0-flash-lite-001">Gemini 2.0 Flash-Lite (001)</option>
                        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
                        <option value="gemini-2.5-flash-lite-preview-09-2025">Gemini 2.5 Flash-Lite (09-2025)</option>
                        <option value="gemini-2.5-flash-image">Gemini 2.5 Flash Image</option>
                        <option value="gemini-exp-1206">Gemini Exp 1206</option>
                    </optgroup>
                    <optgroup label="Gemma 3 Series">
                        <option value="gemma-3-27b-it">Gemma 3 27B</option>
                        <option value="gemma-3-12b-it">Gemma 3 12B</option>
                        <option value="gemma-3-4b-it">Gemma 3 4B</option>
                        <option value="gemma-3-1b-it">Gemma 3 1B</option>
                        <option value="gemma-3-27b-n-it">Gemma 3N 27B</option>
                        <option value="gemma-3-12b-n-it">Gemma 3N 12B</option>
                        <option value="gemma-3-4b-n-it">Gemma 3N 4B</option>
                        <option value="gemma-3n-e4b-it">Gemma 3N E4B</option>
                        <option value="gemma-3n-e2b-it">Gemma 3N E2B</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <a href="readme.html"
                class="p-2 hover:bg-slate-100 rounded-full transition-all text-slate-500 active:scale-90"
                title="About this tool">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </a>
            <div id="status-badge"
                class="hidden sm:block text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200">
                Ready
            </div>
            <button id="settings-btn"
                class="p-2 hover:bg-slate-100 rounded-full transition-all text-slate-500 active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>
        </div>
    </header>

    <div class="flex flex-grow overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar"
            class="hidden lg:flex w-72 flex-col bg-white border-r border-slate-200 overflow-y-auto shrink-0 shadow-sm">
            <div class="px-4 py-3 border-b bg-slate-50/50 flex justify-between items-center">
                <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Model States</h2>
                <div class="flex items-center gap-1">
                    <button id="list-models-btn" title="Fetch available models from API"
                        class="text-slate-400 hover:text-amber-600 transition-colors p-1 rounded-md hover:bg-amber-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                    </button>
                    <button id="copy-models-btn" title="Copy all Model IDs"
                        class="text-slate-400 hover:text-amber-600 transition-colors p-1 rounded-md hover:bg-amber-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="model-tabs" class="grid grid-cols-3 p-2 gap-1 border-b bg-white">
                <button id="tab-v3" onclick="setSidebarTab('v3')"
                    class="py-1.5 text-[9px] font-bold rounded-lg transition-all">G 3.x</button>
                <button id="tab-v25" onclick="setSidebarTab('v25')"
                    class="py-1.5 text-[9px] font-bold rounded-lg transition-all">G 2.5</button>
                <button id="tab-v20" onclick="setSidebarTab('v20')"
                    class="py-1.5 text-[9px] font-bold rounded-lg transition-all">G 2.0</button>
                <button id="tab-gemma" onclick="setSidebarTab('gemma')"
                    class="py-1.5 text-[9px] font-bold rounded-lg transition-all">Gemma</button>
                <button id="tab-others" onclick="setSidebarTab('others')"
                    class="py-1.5 text-[9px] font-bold rounded-lg transition-all">Misc</button>
            </div>
            <div id="model-list" class="flex-grow p-2 space-y-1">
                <!-- Dynamically populated -->
            </div>
        </aside>

        <div class="flex flex-col flex-grow relative min-w-0">
            <!-- Chat Area -->
            <main id="chat-window" class="chat-container flex-grow overflow-y-auto p-4 space-y-6">
                <div id="setup-notice" class="hidden bg-amber-50 border border-amber-100 rounded-2xl p-6 text-center">
                    <p class="text-amber-900 font-bold mb-2 text-sm">System Integration</p>
                    <p class="text-amber-700 text-[11px] mb-4 leading-relaxed">
                        Gemini Robotics-ER 1.5 などの特殊モデルを含むマルチモデル環境です。<br>APIキーを設定して開始してください。
                    </p>
                </div>
            </main>

            <!-- Input Area -->
            <footer class="bg-white border-t p-4 pb-8 md:pb-4 shadow-inner">
                <div class="max-w-4xl mx-auto flex gap-3 items-end">
                    <div class="relative flex-grow">
                        <div id="image-preview-container" class="hidden mb-2 relative inline-block">
                            <img id="image-preview" src=""
                                class="h-20 w-auto rounded-lg border border-slate-200 shadow-sm object-cover">
                            <button id="clear-image-btn"
                                class="absolute -top-2 -right-2 bg-rose-500 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs shadow-md hover:bg-rose-600 transition-colors">&times;</button>
                        </div>
                        <textarea id="user-input" rows="1" placeholder="メッセージを入力、または画像をペースト..."
                            class="w-full bg-slate-100 border-none rounded-2xl px-4 py-3.5 pr-12 resize-none focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all text-sm shadow-sm"
                            oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 200) + 'px'"></textarea>

                        <div id="loading-indicator" class="hidden absolute right-3 bottom-4 flex gap-1">
                            <div class="w-1.5 h-1.5 bg-amber-500 rounded-full loading-dot"></div>
                            <div class="w-1.5 h-1.5 bg-amber-500 rounded-full loading-dot"
                                style="animation-delay: 0.2s"></div>
                            <div class="w-1.5 h-1.5 bg-amber-500 rounded-full loading-dot"
                                style="animation-delay: 0.4s"></div>
                        </div>
                    </div>
                    <button id="send-btn"
                        class="bg-amber-600 hover:bg-amber-700 text-white p-3.5 rounded-2xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:grayscale">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                        </svg>
                    </button>
                </div>
            </footer>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
        <div class="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-bold text-slate-800">API Settings</h3>
                <button id="close-settings"
                    class="text-slate-400 hover:text-slate-600 text-3xl leading-none">&times;</button>
            </div>

            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Google API
                        Key</label>
                    <input type="password" id="api-key-input"
                        class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none transition-all"
                        placeholder="AIzaSy...">
                    <p class="text-[10px] text-slate-400 mt-3 leading-relaxed italic">
                        ※ APIキーはブラウザにのみ保存されます。
                    </p>
                </div>

                <button id="save-key-btn"
                    class="w-full bg-amber-600 hover:bg-amber-700 text-white py-4 rounded-2xl font-bold transition-all shadow-xl active:translate-y-0.5">
                    Save Key
                </button>

                <div class="pt-4 flex flex-col items-center gap-2">
                    <button id="clear-history-btn"
                        class="text-amber-500 text-[10px] font-black uppercase tracking-[0.2em] hover:text-amber-600 transition-colors">
                        Clear History
                    </button>
                    <button id="clear-key-btn"
                        class="text-rose-500 text-[10px] font-black uppercase tracking-[0.2em] hover:text-rose-600 transition-colors">
                        Clear API Data
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Models List Modal -->
    <div id="models-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
        <div
            class="bg-white rounded-[2rem] p-8 max-w-2xl w-full shadow-2xl transform transition-all flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-3">
                    <h3 class="text-xl font-bold text-slate-800">Available Models</h3>
                    <button id="copy-chat-models-btn" title="Copy only Chat model IDs (generateContent supported)"
                        class="hidden text-slate-400 hover:text-amber-600 transition-colors p-1 rounded-md hover:bg-amber-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                        </svg>
                    </button>
                </div>
                <button id="close-models"
                    class="text-slate-400 hover:text-slate-600 text-3xl leading-none">&times;</button>
            </div>

            <div id="models-loading" class="hidden py-12 text-center text-slate-400">
                <div
                    class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent mb-2">
                </div>
                <p class="text-xs font-bold uppercase tracking-widest">Fetching models...</p>
            </div>

            <div id="models-content" class="overflow-y-auto flex-grow pr-2">
                <p class="text-[10px] text-slate-400 mb-4 italic">※ APIから取得可能なモデル一覧です。ここに含まれなくても利用可能なIDが存在する場合があります。</p>
                <div id="models-list-inner" class="space-y-3">
                    <!-- Fetched models will appear here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-28 left-1/2 -translate-x-1/2 px-5 py-2.5 bg-slate-800 text-white text-[11px] font-bold rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-[60] flex items-center gap-2">
        <span id="toast-icon">🤖</span>
        <span id="toast-text">Success</span>
    </div>

    <script src="app.js"></script>
</body>

</html>
