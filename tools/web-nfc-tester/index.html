<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web NFC Tester - WebTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../../js/components/app-layout.js"></script>
    <style>
        .nfc-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }
    </style>
</head>

<body class="bg-slate-50">
    <app-layout>
        <div class="max-w-4xl mx-auto space-y-4">
            <!-- Header -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center text-emerald-600">
                        <i class="fas fa-nfc-symbol fa-xl"></i>
                    </div>
                    <div class="flex-1">
                        <h1 class="text-xl font-bold text-slate-900">Web NFC Tester</h1>
                        <p class="text-slate-500 text-sm">モバイル端末でのNFC読み取りテストツール</p>
                    </div>
                    <a href="readme.html" class="text-slate-400 hover:text-emerald-500 transition-colors">
                        <i class="fas fa-circle-info fa-lg"></i>
                    </a>
                </div>

                <!-- API Support Notice -->
                <div id="support-notice" class="hidden p-3 rounded-xl mb-3 text-sm">
                    <div class="flex items-center gap-2">
                        <i id="support-icon" class="fas fa-circle-exclamation"></i>
                        <span id="support-text" class="font-medium"></span>
                    </div>
                </div>

                <!-- Scan Buttons -->
                <div class="flex gap-2">
                    <button id="start-scan"
                        class="flex-1 px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-200 disabled:opacity-50 disabled:shadow-none flex items-center justify-center gap-2">
                        <i class="fas fa-rss"></i>
                        スキャン開始
                    </button>
                    <button id="stop-scan"
                        class="flex-1 px-4 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-all shadow-lg shadow-red-200 hidden items-center justify-center gap-2 nfc-animation">
                        <i class="fas fa-stop-circle"></i>
                        スキャン中... タップで停止
                    </button>
                </div>
            </div>

            <!-- Device Info (Collapsed) -->
            <details class="bg-white rounded-xl shadow-sm border border-slate-200">
                <summary class="p-3 cursor-pointer text-sm font-bold text-slate-500 hover:text-slate-700">
                    <i class="fas fa-info-circle mr-1"></i> デバイス情報
                </summary>
                <div class="px-4 pb-3 space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-slate-500">Web NFC API</span>
                        <span id="info-api" class="font-mono font-bold">Checking...</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-slate-500">User Agent</span>
                        <span id="info-ua" class="font-mono text-[10px] text-right break-all ml-4"></span>
                    </div>
                </div>
            </details>

            <!-- Log Panel -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <h2 class="text-base font-bold text-slate-800">読み取り記録</h2>
                        <span id="log-count"
                            class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold">0件</span>
                    </div>
                    <button id="clear-logs"
                        class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-medium rounded-lg transition-all flex items-center gap-1">
                        <i class="fas fa-trash-can text-xs"></i>
                        消去
                    </button>
                </div>
                <div id="logs" class="p-3 space-y-3 overflow-y-auto max-h-[60vh] bg-slate-50/50">
                    <!-- Placeholder -->
                    <div id="log-placeholder" class="flex flex-col items-center justify-center text-slate-300 py-12">
                        <i class="fas fa-tags fa-2xl mb-3"></i>
                        <p class="text-sm">タグを読み取るとここに表示されます</p>
                    </div>
                </div>
            </div>
        </div>
    </app-layout>

    <script>
        const startBtn = document.getElementById('start-scan');
        const stopBtn = document.getElementById('stop-scan');
        const clearBtn = document.getElementById('clear-logs');
        const logsContainer = document.getElementById('logs');
        const logPlaceholder = document.getElementById('log-placeholder');
        const logCountLabel = document.getElementById('log-count');
        const infoApi = document.getElementById('info-api');
        const infoUa = document.getElementById('info-ua');
        const supportNotice = document.getElementById('support-notice');
        const supportText = document.getElementById('support-text');
        const supportIcon = document.getElementById('support-icon');

        let logCount = 0;
        let ndef = null;
        let ctrl = null;

        // Initialize UI
        infoUa.textContent = navigator.userAgent;

        if (!('NDEFReader' in window)) {
            infoApi.textContent = '❌ Not Supported';
            infoApi.className = 'font-mono font-bold text-red-500';
            supportNotice.classList.remove('hidden');
            supportNotice.classList.add('bg-red-50', 'text-red-700');
            supportText.textContent = 'Web NFC APIはこのブラウザでサポートされていません。Android版Chromeなどを使用してください。';
            startBtn.disabled = true;
        } else {
            infoApi.textContent = '✅ Supported';
            infoApi.className = 'font-mono font-bold text-emerald-500';
            supportNotice.classList.remove('hidden');
            supportNotice.classList.add('bg-blue-50', 'text-blue-700');
            supportIcon.className = 'fas fa-info-circle';
            supportText.textContent = 'NFC読み取りには端末のNFC機能を有効にする必要があります。';
        }

        async function startScanning() {
            try {
                ndef = new NDEFReader();
                ctrl = new AbortController();

                updateStatus('scanning');

                await ndef.scan({ signal: ctrl.signal });

                ndef.onreadingerror = (event) => {
                    console.log('Reading error event:', event);
                    addLog('Error', 'タグの読み取りに失敗しました（NDEF非対応の可能性）', 'error');
                };

                ndef.onreading = ({ message, serialNumber }) => {
                    processMessage(message, serialNumber);
                };

                ctrl.signal.addEventListener('abort', () => {
                    updateStatus('idle');
                });

            } catch (error) {
                console.error(error);
                if (error.name !== 'AbortError') {
                    updateStatus('error', error.message);
                    addLog('System Error', error.message, 'error');
                }
            }
        }

        function stopScanning() {
            if (ctrl) {
                ctrl.abort();
                ctrl = null;
                updateStatus('idle');
            }
        }

        function updateStatus(state, msg = '') {
            switch (state) {
                case 'scanning':
                    startBtn.classList.add('hidden');
                    stopBtn.classList.remove('hidden');
                    stopBtn.classList.add('flex');
                    break;
                case 'error':
                    startBtn.classList.remove('hidden');
                    stopBtn.classList.add('hidden');
                    startBtn.disabled = false;
                    break;
                case 'idle':
                    startBtn.classList.remove('hidden');
                    stopBtn.classList.add('hidden');
                    startBtn.disabled = false;
                    break;
            }
        }

        function processMessage(message, serialNumber) {
            const timestamp = new Date().toLocaleTimeString();

            const logEntry = document.createElement('div');
            logEntry.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm';

            let recordsHtml = '';
            for (const record of message.records) {
                const type = record.recordType;
                let content = '';

                try {
                    if (type === 'text') {
                        const decoder = new TextDecoder(record.encoding);
                        content = decoder.decode(record.data);
                    } else if (type === 'url') {
                        const decoder = new TextDecoder();
                        content = decoder.decode(record.data);
                    } else {
                        content = `Binary data (${record.data.byteLength} bytes)`;
                    }
                } catch (e) {
                    content = 'Failed to decode content';
                }

                recordsHtml += `
                    <div class="mt-2 pt-2 border-t border-slate-100">
                        <span class="text-[10px] font-bold uppercase py-0.5 px-1.5 rounded bg-slate-100 text-slate-500">${type}</span>
                        <div class="text-sm font-mono break-all text-slate-700 mt-1">${content}</div>
                    </div>
                `;
            }

            logEntry.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center">
                            <i class="fas fa-tag text-xs"></i>
                        </div>
                        <div>
                            <div class="text-[10px] font-bold text-slate-400 uppercase">Serial</div>
                            <div class="text-sm font-mono font-bold text-slate-800">${serialNumber || 'Unknown'}</div>
                        </div>
                    </div>
                    <div class="text-[10px] text-slate-400 font-mono">${timestamp}</div>
                </div>
                ${recordsHtml}
            `;

            if (logPlaceholder && logPlaceholder.parentNode) logPlaceholder.remove();
            logsContainer.insertBefore(logEntry, logsContainer.firstChild);

            logCount++;
            logCountLabel.textContent = `${logCount}件`;
        }

        function addLog(title, message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            const colorClass = type === 'error' ? 'bg-red-50 border-red-100' : 'bg-blue-50 border-blue-100';
            const iconClass = type === 'error' ? 'fa-circle-xmark text-red-500' : 'fa-circle-info text-blue-500';
            const textColor = type === 'error' ? 'text-red-700' : 'text-blue-700';

            logEntry.className = `${colorClass} p-3 rounded-xl border text-sm`;
            logEntry.innerHTML = `
                <div class="flex justify-between items-start mb-1">
                    <div class="flex items-center gap-2">
                        <i class="fas ${iconClass}"></i>
                        <span class="font-bold ${textColor}">${title}</span>
                    </div>
                    <span class="text-[10px] text-slate-400 font-mono">${timestamp}</span>
                </div>
                <div class="text-slate-600 text-xs pl-6">${message}</div>
            `;

            if (logPlaceholder && logPlaceholder.parentNode) logPlaceholder.remove();
            logsContainer.insertBefore(logEntry, logsContainer.firstChild);
        }

        startBtn.addEventListener('click', () => {
            startScanning();
        });

        stopBtn.addEventListener('click', () => {
            stopScanning();
        });

        clearBtn.addEventListener('click', () => {
            logsContainer.innerHTML = '';
            logsContainer.appendChild(logPlaceholder);
            logCount = 0;
            logCountLabel.textContent = '0件';
        });

    </script>
</body>

</html>
